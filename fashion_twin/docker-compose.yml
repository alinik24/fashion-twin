version: "3.9"

# Fashion Twin - Complete Docker Setup
# All services enabled by default for easy pull-and-run experience
#
# Start all services:    docker compose up -d
# Stop all services:     docker compose down
# View logs:             docker compose logs -f
# Database admin:        http://localhost:8081 (user: postgres, password: postgres)

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: fashion_twin_postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: fashion_twin
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./storage/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d fashion_twin"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Adminer - Database Admin UI
  adminer:
    image: adminer:latest
    container_name: fashion_twin_adminer
    restart: unless-stopped
    ports:
      - "8081:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    depends_on:
      postgres:
        condition: service_healthy

  # Qdrant Vector Database
  qdrant:
    image: qdrant/qdrant:latest
    container_name: fashion_twin_qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      QDRANT__SERVICE__GRPC_PORT: 6334
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:6333/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: fashion_twin_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  qdrant_data:
  redis_data:

networks:
  default:
    name: fashion_twin_network
